site_name: Sistemas de Big Data
site_description: Apuntes del módulo SBD (curso de especialización en IA y Big Data) — IES Ataúlfo Argenta
site_url: https://iesataulfoargentasor.github.io/sbd_2026_2027/
repo_url: https://github.com/iesataulfoargentasor/sbd_2026_2027
repo_name: iesataulfoargentasor/sbd_2026_2027
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/branding/logo-ies-ataulfo-argenta.png
  favicon: assets/branding/logo-ies-ataulfo-argenta.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/quiz.css

extra_javascript:
  - javascripts/quiz.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iesataulfoargentasor/sbd_2026_2027
  generator: false

copyright: IES Ataúlfo Argenta · SBD · curso 2026/2027

nav:
  - Inicio: index.md
  - U.T. 1. Integración, procesamiento y análisis de datos:
    - La unidad: ut1/index.md
    - RA1 y criterios de evaluación: ut1/ra1.md
    - Preparar el entorno: ut1/entorno.md
    - 1.1 Del dato al problema de análisis: ut1/problema.md
    - 1.2 Fundamentos matemáticos y algorítmicos: ut1/fundamentos.md
    - 1.3 Planificación del proyecto de análisis: ut1/planificacion.md
    - 1.4 Fuentes y extracción de información: ut1/fuentes.md
    - 1.5 Preparación y calidad de datos: ut1/preproceso.md
    - 1.6 Integración de datos: ut1/integracion.md
    - 1.7 Procesamiento distribuido con Spark: ut1/spark.md
    - 1.8 Transformaciones a escala: ut1/transformaciones-escala.md
    - 1.9 Extracción automática de información: ut1/analisis.md
    - 1.10 Procesamiento de datos en tiempo real: ut1/streaming.md
    - 1.11 Coste, calidad y eficiencia: ut1/coste-calidad.md
    - 1.12 Laboratorio AWS S3–Glue–Athena: ut1/aws-s3-glue-athena.md
    - 1.13 Práctica integradora RA1: ut1/practica.md
    - Autoevaluación: ut1/autoevaluacion.md
    - Continuidad con BDA y SBD: ut1/continuidad.md
    - Fuentes y atribución: ut1/referencias.md

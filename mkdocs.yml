site_name: Sistemas de Big Data
site_description: Apuntes del módulo SBD (curso de especialización en IA y Big Data) — IES Ataúlfo Argenta
site_url: https://iesataulfoargentasor.github.io/sbd_2026_2027_new/
repo_url: https://github.com/iesataulfoargentasor/sbd_2026_2027_new
repo_name: iesataulfoargentasor/sbd_2026_2027_new
edit_uri: edit/main/docs/

theme:
  name: material
  language: es
  logo: assets/branding/logo-ies-ataulfo-argenta.png
  favicon: assets/branding/logo-ies-ataulfo-argenta.png
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Modo claro
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.path
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - toc.follow

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css
  - stylesheets/quiz.css

extra_javascript:
  - javascripts/quiz.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/iesataulfoargentasor/sbd_2026_2027_new
  generator: false

copyright: IES Ataúlfo Argenta · SBD · curso 2026/2027

nav:
  - Inicio: index.md
  - U.T. 1. Integración, procesamiento y análisis:
    - La unidad: ut1/index.md
    - RA1 y criterios de evaluación: ut1/ra1.md
    - Inicio con Python (Colab de arranque): ut1/inicio-python.md
    - Cuadernos de Google Colab: ut1/cuadernos.md
    - 1.0 Marco Big Data: ut1/marco-big-data.md
    - 1.1 Integrar, procesar y analizar: ut1/ciclo-analisis.md
    - 1.2 Fundamentos matemáticos y algoritmos: ut1/fundamentos.md
    - 1.3 Extracción de información: ut1/extraccion.md
    - 1.4 Preproceso de datos: ut1/preproceso.md
    - 1.5 Formatos de datos: ut1/formatos.md
    - 1.6 Planificación con GitHub Projects: ut1/planificacion.md
    - 1.7 Laboratorio AWS (S3, Glue, Athena): ut1/laboratorio-aws.md
    - Modelado y resolución de problemas: ut1/modelado.md
    - Análisis en tiempo real: ut1/tiempo-real.md
    - Costes y calidad: ut1/costes-calidad.md
    - Entorno Docker (Hadoop): ut1/docker.md
    - Autoevaluación: ut1/autoevaluacion.md
    - Continuidad con BDA y RA2–RA4: ut1/continuidad.md
